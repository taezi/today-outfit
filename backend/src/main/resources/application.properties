spring.application.name=backend
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/today_outfit}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

weather.kma.base-url=https://apis.data.go.kr/1360000/VilageFcstInfoService_2.0
weather.kma.service-key=${KMA_SERVICE_KEY:}
weather.kma.nx=60
weather.kma.ny=127
weather.kma.location-name=\uC11C\uC6B8 \uC885\uB85C\uAD6C
